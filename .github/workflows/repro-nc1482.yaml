name: Repro netcdf4-python#1482

# Throwaway investigation workflow: netCDF4 raises PermissionError when a
# directory component of the path contains non-ASCII characters, on Windows.
# macOS/Linux are reported unaffected, so this needs a Windows runner - the
# regular test matrix is ubuntu-only.
# https://github.com/Unidata/netcdf4-python/issues/1482
#
# Push-triggered on this branch only: workflow_dispatch is not selectable until
# the file lands on the default branch.

on:
  push:
    branches: [ci/repro-nc1482]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: ${{ matrix.os }} / netcdf4 ${{ matrix.netcdf4 }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: true  # a reproduced failure is a result, not a broken run
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        netcdf4: ['1.7.2', '1.7.3', '1.7.4']
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.9"
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        run: |
          uv pip install --system .
          uv pip install --system "netcdf4==${{ matrix.netcdf4 }}" h5netcdf h5py

      - name: Reproduce
        # Windows stdout defaults to cp1252, which cannot encode the paths under
        # test - without this the first failure dies in print() instead of being
        # reported, taking the remaining cases with it.
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: python scripts/repro_nc1482.py

  # The PyPI wheels bundle netcdf-C 4.9.2/4.9.3 only. The maintainer asked for a
  # retest against 4.10.1, which on Windows means conda-forge.
  conda:
    name: windows / conda-forge libnetcdf ${{ matrix.libnetcdf }}
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        libnetcdf: ['4.9.3', '4.10.0', '4.10.1']
    steps:
      - uses: actions/checkout@v7

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: nc1482
          condarc: |
            channels: [conda-forge]
          create-args: >-
            python=3.11
            netcdf4=1.7.4
            libnetcdf=${{ matrix.libnetcdf }}
            xarray
            h5netcdf
            h5py

      # `micromamba-shell` is not generated on Windows, so invoke the env directly.
      - name: Reproduce
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: micromamba run -n nc1482 python scripts/repro_nc1482.py
